name: lab1

services:
  db:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    networks: [lab1-net]

  app:
    build: ./app
    image: lab1-app:1.0
    environment:
      DB_HOST: db
      DB_PORT: "6379"
    networks: [lab1-net]
    depends_on: [db]

  proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lab1-net]
    depends_on: [app]

networks:
  lab1-net:
    name: lab1-net  # явне ім'я, інакше Compose назве мережу lab1_lab1-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
